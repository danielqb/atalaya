<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="#e11d48" stroke-width="2"/>
  
  <!-- Tower/Watchtower base (Atalaya) -->
  <rect x="75" y="110" width="50" height="35" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="70,110 100,70 130,110" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  
  <!-- Tower stones/bricks texture -->
  <line x1="75" y1="120" x2="125" y2="120" stroke="#475569" stroke-width="0.8" opacity="0.6"/>
  <line x1="75" y1="130" x2="125" y2="130" stroke="#475569" stroke-width="0.8" opacity="0.6"/>
  <line x1="75" y1="140" x2="125" y2="140" stroke="#475569" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Spotlight beam (surveillance) -->
  <circle cx="100" cy="75" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="100" cy="75" r="5" fill="#fef3c7" opacity="0.8"/>
  
  <!-- Light rays emanating from tower -->
  <g stroke="#fbbf24" stroke-width="1.5" opacity="0.7" stroke-linecap="round">
    <line x1="100" y1="75" x2="65" y2="45"/>
    <line x1="100" y1="75" x2="135" y2="45"/>
    <line x1="100" y1="75" x2="50" y2="75"/>
    <line x1="100" y1="75" x2="150" y2="75"/>
  </g>
  
  <!-- Alert pulse circles (real-time monitoring) -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#ec4899" stroke-width="0.8" opacity="0.2"/>
  
  <!-- AI brain/node (Intelligence) -->
  <circle cx="100" cy="100" r="12" fill="#06b6d4" stroke="#0891b2" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="8" fill="#67e8f9" opacity="0.8"/>
  
  <!-- Connecting nodes for network intelligence -->
  <g stroke="#06b6d4" stroke-width="1" opacity="0.6">
    <circle cx="85" cy="85" r="3" fill="#06b6d4"/>
    <circle cx="115" cy="85" r="3" fill="#06b6d4"/>
    <circle cx="85" cy="115" r="3" fill="#06b6d4"/>
    <circle cx="115" cy="115" r="3" fill="#06b6d4"/>
    <line x1="93" y1="93" x2="107" y2="107"/>
    <line x1="107" y1="93" x2="93" y2="107"/>
  </g>
  
  <!-- Shield element (Protection/Security) -->
  <path d="M 100 85 L 115 95 L 112 115 Q 100 125 100 125 Q 100 125 88 115 L 85 95 Z" 
        fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Alert indicator (Warning) -->
  <circle cx="130" cy="70" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  <circle cx="130" cy="70" r="3" fill="#fca5a5"/>
  
  <!-- Project name or initials -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        text-anchor="middle" fill="#e11d48">ATALAYA</text>
  
  <!-- Subtitle -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" 
        fill="#94a3b8" opacity="0.8">AI Risk Management</text>
</svg>