<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atalaya Tactical Feed</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: #101418;
      color: #f4f7fb;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 0;
    }

    .status {
      color: #80e0a7;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin: 24px 0;
    }

    button {
      background: #2f80ed;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #2a3038;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 18px;
    }

    .panel {
      background: #171d24;
      border: 1px solid #2a3038;
      border-radius: 8px;
      padding: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #2a3038;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #9fb0c3;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr {
      cursor: pointer;
    }

    tr:hover {
      background: #1d2630;
    }

    .priority {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .critical {
      background: #ff4d4f;
      color: #120506;
    }

    .high {
      background: #ffb020;
      color: #1b1000;
    }

    .medium {
      background: #4cc9f0;
      color: #031017;
    }

    .low {
      background: #6c7682;
      color: #fff;
    }

    .muted {
      color: #9fb0c3;
    }

    .brief {
      line-height: 1.5;
      font-size: 17px;
    }

    @media (max-width: 860px) {
      main {
        padding: 20px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Atalaya</h1>
        <div class="muted">Feed tactico TAK/CoT para coordinadores de emergencia</div>
      </div>
      <div class="status">listener online</div>
    </header>

    <div class="toolbar">
      <button onclick="simulate()">Simular eventos</button>
      <button onclick="publishDemoToOts()">Publicar demo en OTS</button>
      <button onclick="syncOts()">Sincronizar OTS</button>
      <button class="secondary" onclick="openOtsMap()">Abrir mapa OTS</button>
      <button class="secondary" onclick="resetEvents()">Limpiar feed</button>
    </div>

    <section class="layout">
      <div class="panel">
        <h2>Eventos</h2>
        <table>
          <thead>
            <tr>
              <th>Fuente</th>
              <th>Tipo</th>
              <th>Geo</th>
              <th>Prioridad</th>
              <th>Aviso</th>
            </tr>
          </thead>
          <tbody id="events"></tbody>
        </table>
      </div>

      <aside class="panel">
        <h2>Alerta seleccionada</h2>
        <div id="detail" class="muted">
          Selecciona o simula un evento para ver el brief tactico.
        </div>
      </aside>
    </section>
  </main>

  <script>
    let selected = null;
    let otsMapUrl = null;

    async function loadOtsConfig() {
      const response = await fetch("/api/ots/config");
      const data = await response.json();
      otsMapUrl = data.map_url || null;
    }
    const priorityClass = (priority) => {
      const knownPriorities = ["critical", "high", "medium", "low"];
      return knownPriorities.includes(priority) ? priority : "medium";
    };

    async function fetchEvents() {
      const response = await fetch("/api/events");
      const data = await response.json();
      render(sortTacticalFeed(data.events || []));
    }

    function sortTacticalFeed(events) {
      const priorityRank = { critical: 0, high: 1, medium: 2, low: 3 };
      return [...events].sort((left, right) => {
        if (left.accepted !== right.accepted) {
          return left.accepted ? -1 : 1;
        }
        return priorityRank[left.priority] - priorityRank[right.priority];
      });
    }

    function render(events) {
      const body = document.getElementById("events");
      body.innerHTML = events.map((event, idx) => `
        <tr onclick="selectEvent(${idx})">
          <td>${event.callsign}</td>
          <td>${event.type}</td>
          <td>${event.distance_m} m al ${event.relative_direction}</td>
          <td>
            <span class="priority ${priorityClass(event.priority)}">
              ${event.priority_label || event.priority}
            </span>
          </td>
          <td>${event.headline}</td>
        </tr>
      `).join("");

      window.__events = events;
      if (!selected && events.length) {
        selectEvent(0);
      }
    }

    function selectEvent(idx) {
      selected = window.__events[idx];
      const detail = document.getElementById("detail");
      detail.innerHTML = `
        <h3>${selected.headline}</h3>
        <p class="brief">${selected.brief}</p>
        <p><strong>Accion:</strong> ${selected.recommended_action}</p>
        <p class="muted">Decision: ${selected.decision_reason}</p>
      `;
    }

    async function simulate() {
      await fetch("/api/simulate", { method: "POST" });
      await fetchEvents();
    }

    async function syncOts() {
      const response = await fetch("/api/ots/sync", { method: "POST" });
      if (!response.ok) {
        const error = await response.json();
        alert(`No se pudo sincronizar OTS: ${error.detail}`);
        return;
      }
      await fetchEvents();
    }

    async function publishDemoToOts() {
      const response = await fetch("/api/ots/publish-demo", { method: "POST" });
      if (!response.ok) {
        const error = await response.json();
        alert(`No se pudo publicar en OTS: ${error.detail}`);
        return;
      }
      await fetchEvents();
    }

    function openOtsMap() {
      if (!otsMapUrl) {
        alert("Configura OTS_BASE_URL u OTS_MAP_URL para abrir el mapa de OpenTAKServer.");
        return;
      }
      window.open(otsMapUrl, "_blank", "noopener");
    }

    async function resetEvents() {
      selected = null;
      await fetch("/api/events/reset", { method: "POST" });
      document.getElementById("detail").innerHTML = "Feed limpio.";
      await fetchEvents();
    }

    loadOtsConfig();
    fetchEvents();
    setInterval(fetchEvents, 2000);
  </script>
</body>
</html>
